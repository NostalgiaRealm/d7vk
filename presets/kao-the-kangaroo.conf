# Copy to dxvk.conf beside kao.exe, or select with DXVK_CONFIG_FILE.
# The game keeps its own logical resolution; the renderer uses 2560x1440.
[kao.exe]
d7vk.resolution = 2560x1440
d7vk.msaa = 8
d7vk.filtering = 16
d7vk.keepPointFiltering = False
d7vk.mipmapping = app
d7vk.windowMode = app
d7vk.depthBits = 0
d7vk.forceVSync = False
# Match the supplied dgVoodoo preset with vSync disabled.
d3d9.presentInterval = 0
